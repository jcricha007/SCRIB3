name: Python regression
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      SCRIB3_DESKTOP_TESTS: ${{ matrix.os == 'windows-latest' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  native-artwork-import:
    runs-on: ubuntu-latest
    env:
      SCRIB3_NATIVE_IMPORT_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Install Inkscape, Ghostscript and LibreDWG 0.14
        run: |
          sudo add-apt-repository -y ppa:inkscape.dev/stable
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends inkscape ghostscript build-essential pkg-config libxml2-dev
          curl -fL https://github.com/LibreDWG/libredwg/releases/download/0.14/libredwg-0.14.tar.xz -o "$RUNNER_TEMP/libredwg.tar.xz"
          echo "62ebb73b984f865960f20ed26619ea5f8789d5e3fd088fa40a2598384da81275  $RUNNER_TEMP/libredwg.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/libredwg.tar.xz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/libredwg-0.14"
          CFLAGS='-O0' ./configure --disable-shared --disable-bindings
          make -j2 -C src
          make -j2 -C programs dwg2dxf dxf2dwg
          echo "$RUNNER_TEMP/libredwg-0.14/programs" >> "$GITHUB_PATH"
      - name: Exercise real PDF, AI, PNG, PSD and DWG files
        run: python -m unittest discover -s tests -p test_artwork_import.py -v
